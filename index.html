<html lang="ja">
<head>

<style>
:root { --bg:#f4f2ec; --ink:#1f1f1f; --sub:#6f6f6f; --panel:#fbfaf6; --line:rgba(0,0,0,.12); --accent:#d2452b; --btn:#fff; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#17181a; --ink:#ececec; --sub:#9a9a9a; --panel:#1f2023; --line:rgba(255,255,255,.13); --btn:#2a2b2f; color-scheme:dark; }
}
:root[data-theme="dark"] { --bg:#17181a; --ink:#ececec; --sub:#9a9a9a; --panel:#1f2023; --line:rgba(255,255,255,.13); --btn:#2a2b2f; color-scheme:dark; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
  font:14px/1.45 -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
#app { display:flex; flex-direction:column; height:100vh; height:100dvh; }
#view { position:relative; flex:1; min-height:0; background:#222; }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.hint { position:absolute; top:calc(env(safe-area-inset-top, 0px) + 12px); left:16px; right:16px; text-align:center;
  color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); pointer-events:none; transition:opacity .8s; }
#panel { flex:none; max-height:50dvh; overflow-y:auto; background:var(--panel); border-top:1px solid var(--line);
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(16px, env(safe-area-inset-left, 0px)); }
header { display:flex; align-items:baseline; gap:8px; }
h1 { font-size:15px; margin:0; font-weight:700; }
h1 small { font-weight:400; color:var(--sub); margin-left:6px; font-size:12px; }
#fold { margin-left:auto; border:1px solid var(--line); background:var(--btn); color:var(--ink); border-radius:6px; padding:2px 10px; font-size:12px; }
.presets { display:flex; gap:8px; margin:10px 0 4px; }
.presets button { flex:1; padding:9px 0; border:1.5px solid var(--accent); color:var(--accent); background:var(--btn);
  border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; }
.presets button:active { background:var(--accent); color:#fff; }

#sound.on { border-color:var(--accent); color:var(--accent); }
.knob { padding:6px 0 4px; }
.cat { margin:14px 0 2px; padding-top:8px; border-top:1px solid var(--line); font-size:12px; font-weight:700; color:var(--accent); }
.cat small { font-weight:400; color:var(--sub); margin-left:6px; }

@media (min-width:860px) {
  #app { flex-direction:row; }
  #panel { width:340px; max-height:none; border-top:0; border-left:1px solid var(--line); padding:18px 20px; }
  #fold { display:none; }
  #panel.folded .more { display:block; }
}
</style>

<body>
<div id="app">
  <div id="view">
    <canvas id="c"></canvas>
    <div class="hint" id="hint">同じ物体のまま、大きさの「手がかり」だけを動かす</div>
  </div>
  <aside id="panel">
    <header><h1>大きさ<small>スケール操作盤</small></h1><button id="fold" type="button">つまみを隠す</button></header>
    <div class="presets"><button type="button" data-p="0">模型</button><button type="button" data-p="1">巨大</button></div>
    <button type="button" id="sound">音を出す(ヘッドホン推奨)</button>
    <div class="knob master">
      <div class="top"><span class="name">全部まとめて</span></div>
      <input type="range" id="master" min="0" max="1000" value="0">
      <div class="ends"><span>模型</span><span>巨大</span></div>
    </div>
    <div class="more">
      <div id="knobs"></div>
      <details>
        <summary>これは何？</summary>
        <p>冷却塔の形と、画面の中での大きさは、どのつまみを動かしても変わらない。変わるのは、ぼけ・かすみ・模様の細かさ・動きの速さ・まわりの物・光・視点・色だけ。</p>
        <p>それでも模型にも、高さ150mの塔にも見える。大きさは目に見えているのではなく、こうした手がかりから推し量っている。1本ずつ動かすと、どの手がかりがよく効くかを確かめられる。</p>
      </details>
    </div>
  </aside>
</div>

<script type="module">
import * as THREE from 'three';

// ---------- つまみ(0 = 模型側、1 = 巨大側) ----------
const KNOBS = [
  { id:'dof', cat:'lens',      name:'被写界深度',       ends:['浅い(ぼける)', 'パンフォーカス'] },
  { id:'fog', cat:'air',      name:'大気(かすみ)',     ends:['澄んでいる', 'かすむ'] },
  { id:'detail', cat:'cmp',   name:'ディテールの周期', ends:['粗い・つるつる', '細かい・汚れ'] },
  { id:'speed', cat:'view',    name:'動きの速さ',       ends:['速い', 'ゆっくり'] },
  { id:'parallax', cat:'view', name:'視差',             ends:['大きく回り込む', 'ほとんど動かない'] },
  { id:'ref', cat:'cmp',      name:'参照物',           ends:['机の小物', 'なし', '柵・街灯・管理棟'] },
  { id:'light', cat:'air',    name:'光',               ends:['近くのライト', '曇り空の拡散光'] },
  { id:'view', cat:'view',     name:'視点の高さ',       ends:['見下ろす', '人の目の高さ'] },
  { id:'sat', cat:'lens',      name:'彩度',             ends:['鮮やか', 'くすむ'] },
  { id:'cloud', cat:'air',    name:'雲',               ends:['なし', '頂上にかかる・影が流れる'] },
  { id:'blue', cat:'air',     name:'空気の青み',       ends:['色が変わらない', '遠くほど青い'] },
  // 画角は模型・巨大のどちらとも決まらないので、ボタンと「全部まとめて」では動かさない(free)。
  // 塔の画面上の大きさは保ったまま、画角に合わせてカメラが寄る・離れる(ドリーズーム)
  { id:'fov', cat:'lens',      name:'画角(ボタンでは動かない)', ends:['望遠 20°', '広角 90°'], free:true, init:0.46 },
  { id:'sound', cat:'snd',    name:'音(「音を出す」で鳴る)', ends:['狭い部屋・乾いた高い音', '広い空間・長い響き・低い唸り'] },
];
// 画面での並べ方(?k= の順番は上の KNOBS のまま変えない)
const CATS = [
  { id:'lens', name:'レンズと仕上げ', note:'どう写すか' },
  { id:'air',  name:'空気と光',       note:'あいだの空気と、照らし方' },
  { id:'view', name:'視点と動き',     note:'どこから、どう動いて見るか' },
  { id:'cmp',  name:'比較',           note:'大きさの分かる物と並べる' },
  { id:'snd',  name:'音響',           note:'響きと音の高さ' },
];
const k = Object.fromEntries(KNOBS.map(o => [o.id, o.init ?? 0]));
const TIED = KNOBS.filter(o => !o.free);   // ボタンと「全部まとめて」で動くつまみ

const lerp = (a, b, t) => a + (b - a) * t;
const lerpLog = (a, b, t) => Math.exp(lerp(Math.log(a), Math.log(b), t));
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ---------- 描画の準備 ----------
const canvas = document.getElementById('c');
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 1, 40000);
const FOG_COL = new THREE.Color(0xcfd4d9);
scene.fog = new THREE.FogExp2(FOG_COL.clone(), 0);

const rt = new THREE.WebGLRenderTarget(4, 4, { type:THREE.HalfFloatType, samples:4 });
rt.depthTexture = new THREE.DepthTexture(4, 4);
rt.depthTexture.type = THREE.UnsignedIntType;

// ---------- シェーダーの部品 ----------
const NOISE = `
float h11(float x){ return fract(sin(x*127.1)*43758.5453); }
float n1(float x){ float i=floor(x), f=fract(x); f=f*f*(3.-2.*f); return mix(h11(i), h11(i+1.), f); }
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i), h21(i+vec2(1.,0.)), f.x), mix(h21(i+vec2(0.,1.)), h21(i+1.), f.x), f.y); }
// 間隔 s の線。画面で細かすぎるときは消す(ちらつき防止)
float lines(float x, float s){ float fw = fwidth(x)/s; float f = abs(fract(x/s+.5)-.5);
  return (1.-smoothstep(.5*fw, 1.5*fw, f)) * (1.-smoothstep(.25, .6, fw)); }
// 流れる雲の影(高さ900mの雲を、日の光の向きに沿って落とす。t は時刻)
float cloudSh(vec3 w, float t){
  vec2 p = w.xz + vec2(-.333, .5) * (900. - w.y) - vec2(8., 3.) * t;
  float n = n2(p / 380.) * .65 + n2(p / 150. + 5.) * .35;
  return smoothstep(.4, .6, n);
}
`;
// 雲の影は塔と地面の両方に同じ式で落とす
const CS = { uCS:{ value:0, glsl:'float' }, uWT:{ value:0, glsl:'float' } };
const WORLD_POS = `vec4 wp_ = vec4(transformed, 1.);
#ifdef USE_INSTANCING
wp_ = instanceMatrix * wp_;
#endif
vW = (modelMatrix * wp_).xyz;`;
function patch(mat, uniforms, vary, vertCode, fragCode) {
  mat.onBeforeCompile = s => {
    Object.assign(s.uniforms, uniforms);
    s.vertexShader = s.vertexShader
      .replace('#include <common>', '#include <common>\n' + vary)
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n' + vertCode);
    s.fragmentShader = s.fragmentShader
      .replace('#include <common>', '#include <common>\n' + vary + Object.keys(uniforms).map(n => `uniform ${uniforms[n].glsl} ${n};`).join('\n') + NOISE)
      .replace('#include <color_fragment>', '#include <color_fragment>\n' + fragCode.color)
      .replace('#include <normal_fragment_maps>', '#include <normal_fragment_maps>\n' + (fragCode.normal || ''))
      .replace('#include <fog_fragment>', (fragCode.fog || '') + '\n#include <fog_fragment>');
  };
}

// ---------- 冷却塔 ----------
const H = 150, Y_LEG = 11, R_THROAT = 34, Y_THROAT = 118, R_BASE = 56;
const C_HYP = Y_THROAT / Math.sqrt((R_BASE / R_THROAT) ** 2 - 1);
const towerR = y => R_THROAT * Math.sqrt(1 + ((y - Y_THROAT) / C_HYP) ** 2);
const R_LEG = towerR(Y_LEG), R_TOP = towerR(H);

const TU = { uDetail:{ value:0, glsl:'float' }, ...CS };
const towerMat = new THREE.MeshStandardMaterial({ color:0xcdc8be, roughness:0.4, side:THREE.DoubleSide });
patch(towerMat, TU, 'varying vec3 vL;\nvarying vec3 vW;\n', 'vL = transformed;\n' + WORLD_POS, { color:`
{
  diffuseColor.rgb *= 1. - uCS * .55 * cloudSh(vW, uWT);
  float d = uDetail;
  float uc = atan(vL.z, vL.x) * 45.;              // 周方向(直径に関係なく縦の目地がまっすぐ並ぶように)
  float sY = exp(mix(log(24.), log(1.25), d));    // 型枠の打ち継ぎ(横の線)の間隔
  float sX = exp(mix(log(36.), log(3.2), d));     // 縦の目地の間隔
  float L = max(lines(vL.y, sY), lines(uc, sX) * .6);
  float kk = 1. - L * mix(.10, .22, d);
  kk *= 1. + (h11(floor(vL.y / sY) * 1.7) - .5) * .12 * d;     // 打ち継ぎごとの色むら
  float col = n1(uc * .9) * n1(uc * .23 + 3.);
  float streak = smoothstep(.3, .85, col) * smoothstep(30., 150., vL.y + n1(uc * .5) * 40.);
  kk -= streak * .22 * d;                                    // 雨だれ
  kk -= (1. - smoothstep(Y_LEG_, 40., vL.y)) * .14 * d;        // 足もとの汚れ
  float g = n2(vec2(uc, vL.y) * 1.3);
  kk += (g - .5) * .14 * d * (1. - smoothstep(.3, 1., fwidth(vL.y) * 1.3));
  // 実物らしさ: 頂上の縁から垂れる細い雨だれ、型枠1枚ごとの色むら、大きなしみ
  float sc = n1(uc * 2.3) * n1(uc * .71 + 5.);
  float runLen = 25. + 100. * n1(uc * 1.7 + 9.);
  kk -= smoothstep(.3, .8, sc) * (1. - smoothstep(runLen * .4, runLen, H_ - vL.y)) * .22 * d;
  kk *= 1. + (h21(vec2(floor(uc / sX), floor(vL.y / sY))) - .5) * .07 * d;
  kk *= 1. + (n2(vec2(uc * .04, vL.y * .025)) - .5) * .22 * d;
  diffuseColor.rgb *= kk;
  diffuseColor.rgb *= mix(vec3(1.), vec3(1.02, 1., .96), n2(vec2(uc * .02, vL.y * .01)) * d);
  if (!gl_FrontFacing) diffuseColor.rgb *= .5;
}`.replace('Y_LEG_', Y_LEG.toFixed(1)).replace('H_', H.toFixed(1)),
  // 打ち継ぎの段差と、面のうねり(光を受けて浮かぶ凹凸)。遠くて細かすぎる段差は消す
  normal:`
{
  float d = uDetail;
  float uc = atan(vL.z, vL.x) * 45.;
  float sY = exp(mix(log(24.), log(1.25), d));
  float f = fract(vL.y / sY);
  float fade = 1. - smoothstep(.12, .45, fwidth(vL.y) / sY);
  float hgt = (-.025 * (1. - smoothstep(0., .07, f)) + .012 * f) * fade * d
            + .06 * n2(vec2(uc * .25, vL.y * .06)) * d;
  vec3 sx = dFdx(-vViewPosition), sy = dFdy(-vViewPosition);
  vec3 r1 = cross(sy, normal), r2 = cross(normal, sx);
  float det = dot(sx, r1);
  vec3 grad = sign(det) * (dFdx(hgt) * r1 + dFdy(hgt) * r2);
  normal = normalize(abs(det) * normal - grad);
}` });

function makeTowerGeo() {
  const pts = [];
  for (let i = 0; i <= 80; i++) { const y = Y_LEG + (H - Y_LEG) * i / 80; pts.push(new THREE.Vector2(towerR(y), y)); }
  return new THREE.LatheGeometry(pts, 180);
}
const towerGeo = makeTowerGeo();
const rimGeo = new THREE.TorusGeometry(R_TOP, 0.6, 6, 180).rotateX(Math.PI / 2).translate(0, H, 0);
const ringGeo = new THREE.TorusGeometry(R_LEG, 0.9, 6, 180).rotateX(Math.PI / 2).translate(0, Y_LEG, 0);

// V 字の柱
const N_LEG = 44;
const legGeo = new THREE.CylinderGeometry(0.8, 0.8, 1, 6);
function makeLegs() {
  const m = new THREE.InstancedMesh(legGeo, towerMat, N_LEG * 2);
  const up = new THREE.Vector3(0, 1, 0), q = new THREE.Quaternion(), mtx = new THREE.Matrix4();
  let n = 0;
  for (let i = 0; i < N_LEG; i++) {
    const a = i / N_LEG * Math.PI * 2, da = Math.PI / N_LEG;
    const top = new THREE.Vector3(Math.cos(a) * R_LEG, Y_LEG, Math.sin(a) * R_LEG);
    for (const s of [-1, 1]) {
      const b = a + s * da;
      const bot = new THREE.Vector3(Math.cos(b) * (R_LEG + 1.5), 0, Math.sin(b) * (R_LEG + 1.5));
      const dir = top.clone().sub(bot), len = dir.length();
      q.setFromUnitVectors(up, dir.normalize());
      mtx.compose(bot.clone().lerp(top, .5), q, new THREE.Vector3(1, len, 1));
      m.setMatrixAt(n++, mtx);
    }
  }
  m.castShadow = m.receiveShadow = true;
  return m;
}
function makeTower(x, z) {
  const g = new THREE.Group();
  const shell = new THREE.Mesh(towerGeo, towerMat);
  const rim = new THREE.Mesh(rimGeo, towerMat), ring = new THREE.Mesh(ringGeo, towerMat);
  for (const o of [shell, rim, ring]) { o.castShadow = o.receiveShadow = true; g.add(o); }
  g.add(makeLegs());
  g.position.set(x, 0, z);
  scene.add(g);
  return g;
}
const T2 = new THREE.Vector2(-270, -340);
makeTower(0, 0);
makeTower(T2.x, T2.y);
// 奥に並ぶ塔(霧の層ごとに薄れて、距離が見えるように)。カメラから見て手前の塔の向こう 280〜900m に、左右へ散らして置く
const BACK = [[-428, -104], [114, -522], [-841, -315], [-73, -908], [-644, -688], [163, -856]];
for (const [x, z] of BACK) makeTower(x, z);

// ---------- 地面 ----------
const GU = {
  uMat:{ value:1, glsl:'float' }, uSite:{ value:0, glsl:'float' },
  uHor:{ value:new THREE.Color(), glsl:'vec3' }, uT2:{ value:T2, glsl:'vec2' }, ...CS,
};
const groundMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.95 });
patch(groundMat, GU, 'varying vec3 vW;\n', 'vW = (modelMatrix * vec4(transformed, 1.)).xyz;', {
  color:`
{
  vec2 p = vW.xz; float r = length(p); float r2 = length(p - uT2);
  vec3 neu = vec3(.50, .49, .46) * (.96 + .08 * n2(p * .015));
  // カッターマット(1目盛 = 模型の 1cm = 5)
  vec3 mc = vec3(.09, .25, .19) * (.95 + .1 * n2(p * .2));
  float gm = max(lines(p.x, 5.), lines(p.y, 5.)) * .22 + max(lines(p.x, 25.), lines(p.y, 25.)) * .45
           + max(lines(p.x, 125.), lines(p.y, 125.)) * .7;
  mc = mix(mc, vec3(.62, .80, .70), clamp(gm, 0., 1.));
  // 敷地(1 = 1m)
  vec3 gr = mix(vec3(.25, .30, .17), vec3(.40, .38, .25), smoothstep(.3, .7, n2(p * .004)));
  gr *= .8 + .35 * n2(p * .08); gr *= .92 + .16 * n2(p * 1.1);
  gr *= .88 + .24 * n2(p * 9.) * (1. - smoothstep(.2, .8, fwidth(p.x) * 9.));   // 近くの草の粒
  float pad = 1. - smoothstep(96., 98., min(r, r2));
  vec3 conc = vec3(.60, .59, .56) * (.9 + .15 * n2(p * .6));
  conc *= 1. - .25 * max(lines(p.x, 6.), lines(p.y, 6.));
  vec3 site = mix(gr, conc, pad);
  float rd = min(abs(r - 140.), abs(p.x - 140.));
  float road = 1. - smoothstep(3.8, 4.3, rd);
  site = mix(site, vec3(.19, .19, .20) * (.9 + .2 * n2(p * 2.)), road);
  float dash = (1. - smoothstep(.1, .18, abs(p.x - 140.))) * step(.5, fract(p.y / 9.)) * step(150., r)
             + (1. - smoothstep(.1, .18, abs(r - 140.))) * step(.5, fract(atan(p.y, p.x) * 140. / 9.));
  site = mix(site, vec3(.85, .82, .62), clamp(dash, 0., 1.) * road);
  vec3 c = mix(neu, mc, uMat);
  c = mix(c, site, uSite);
  c *= 1. - .35 * (1. - smoothstep(50., 66., r)) - .3 * (1. - smoothstep(50., 66., r2));   // 塔の足もとの陰
  c *= 1. - uCS * .55 * cloudSh(vW, uWT);
  diffuseColor.rgb = c;
}`,
  fog:`gl_FragColor.rgb = mix(gl_FragColor.rgb, uHor, smoothstep(2500., 14000., length(vW.xz - cameraPosition.xz)));`,
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60000, 60000).rotateX(-Math.PI / 2), groundMat);
ground.receiveShadow = true;
scene.add(ground);

// ---------- 空 ----------
const SU = { uTop:{ value:new THREE.Color() }, uHor:{ value:new THREE.Color() }, uBot:{ value:new THREE.Color() }, uCloud:{ value:new THREE.Vector3() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(30000, 32, 16), new THREE.ShaderMaterial({
  uniforms:SU, side:THREE.BackSide, depthWrite:false, fog:false,
  vertexShader:`varying vec3 vD; void main(){ vD = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.); gl_Position = p.xyww; }`,
  fragmentShader:`uniform vec3 uTop, uHor, uBot, uCloud; varying vec3 vD;
    ${NOISE}
    void main(){ float y = vD.y; vec3 c = y > 0. ? mix(uHor, uTop, pow(clamp(y, 0., 1.), .6)) : mix(uHor, uBot, clamp(-y * 6., 0., 1.));

  const amp = lerp(0.55, 0.03, k.parallax);
  const az = AZ0 + amp * Math.sin(t * 0.055);
  const camY = lerpLog(250, 1.7, v) * (1 + 0.12 * (1 - k.parallax) * Math.sin(t * 0.04 + 1));
  const ty = lerp(58, 82, v);
  let lo = 80, hi = 8000;
  for (let i = 0; i < 22; i++) { const m = (lo + hi) / 2; if (fits(camY, ty, az, m)) hi = m; else lo = m; }
  camera.position.set(Math.sin(az) * hi, camY, Math.cos(az) * hi);
  const nd = Math.max(150, hi - 30);
  near.position.set(Math.sin(AZ0) * nd, 0, Math.cos(AZ0) * nd); near.rotation.y = AZ0;
  camera.lookAt(0, ty, 0);
  camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
  const hpx = rt.height;
  PU.uFocus.value = camera.position.distanceTo(tv.set(0, ty, 0));
  PU.uAperture.value = (1 - k.dof) ** 1.5 * 0.13 * hpx;
  PU.uMaxR.value = (1 - k.dof) * Math.min(26, 0.026 * hpx);
}

// 動くもの(時間 t は「巨大」で1秒 = 1秒、「模型」では速く進む)
function animate(t) {
  const RISE = 240, LIFE = 40;  // 湯気は約6m/sで上がる
  for (const p of steam) {
    const ph = (t / LIFE + p.ph) % 1;
    const spread = R_TOP * (0.55 + ph * 1.1);
    p.s.position.set(p.cx + p.jx * spread * 0.6 + ph * ph * 120, H + 4 + ph * RISE, p.cz + p.jz * spread * 0.6);
    const sz = (55 + ph * 190) * p.sz;
    p.s.scale.set(sz, sz, 1);
    p.s.material.uniforms.rotation.value = p.rot + ph * 0.3;   // 上を明るく塗ってあるので、ほとんど回さない
    p.s.material.uniforms.opacity.value = Math.sin(Math.PI * Math.min(1, ph * 1.4)) ** 1.5 * 0.62 * (1 - ph * 0.5);
  }
  // 雲は 8m/s で流れる。カメラのすぐそばの雲は消す(画面をふさがないように)
  for (const c of clouds) {
    c.s.visible = k.cloud > 0.01;
    if (!c.s.visible) continue;
    const u = ((c.x0 + 8 * t) % c.w) / c.w;
    const x = c.cx + u * c.w - c.w / 2;   // 幅 w の中を流れて、反対側から戻る(端では消えているので、飛ぶのは見えない)
    // 平たい塊にして、見える部分の下端(中心から高さの約35%下)を雲の底 c.y にそろえる
    const hh = c.sz * 0.45;
    c.s.position.set(x, c.y + hh * 0.35, c.z);
    c.s.scale.set(c.sz * 2, hh, 1);
    // 上から見下ろすときは薄くする(雲の層の上に出ると、下が全部隠れてしまうため)
    c.s.material.uniforms.opacity.value = c.a * k.cloud * smooth(80, 260, c.s.position.distanceTo(camera.position))
      * (1 - 0.8 * smooth(c.y, c.y + 80, camera.position.y))
      * smooth(0, .2, u) * (1 - smooth(.8, 1, u));
  }
  CS.uCS.value = k.cloud; CS.uWT.value = t;
}

// ---------- 画面サイズ ----------
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const W = Math.round(w * DPR), Hh = Math.round(h * DPR);
  rt.setSize(W, Hh); fxRT.setSize(W, Hh); PU.uRes.value.set(W, Hh); FXU.uRes.value.set(W, Hh);
}
new ResizeObserver(resize).observe(view);
resize();

// ---------- UI ----------
const box = document.getElementById('knobs');
const inputs = {};
for (const c of CATS) {
  const h = document.createElement('div'); h.className = 'cat';
  h.innerHTML = `${c.name}<small>${c.note}</small>`; box.appendChild(h);
  for (const o of KNOBS.filter(o => o.cat === c.id)) {
    const d = document.createElement('div'); d.className = 'knob';
    d.innerHTML = `<div class="top"><span class="name">${o.name}</span></div><input type="range" min="0" max="1000" value="0" aria-label="${o.name}"><div class="ends">${o.ends.map(e => `<span>${e}</span>`).join('')}</div>`;
    const inp = d.querySelector('input');
    inp.addEventListener('input', () => { anim = null; k[o.id] = inp.value / 1000; syncMaster(); touched(); });
    inputs[o.id] = inp; box.appendChild(d);
  }
}
const master = document.getElementById('master');
syncInputs();   // 画角つまみの初めの位置を出す
master.addEventListener('input', () => { anim = null; const v = master.value / 1000; for (const o of TIED) k[o.id] = v; syncInputs(); touched(); });
function syncInputs() { for (const o of KNOBS) inputs[o.id].value = Math.round(k[o.id] * 1000); }
function syncMaster() { master.value = Math.round(TIED.reduce((s, o) => s + k[o.id], 0) / TIED.length * 1000); }
let anim = null;
function goTo(target, dur = 1800) { anim = { from:{ ...k }, to:{ ...k, ...Object.fromEntries(TIED.map(o => [o.id, target])) }, t0:performance.now(), dur }; touched(); }
document.querySelectorAll('.presets button').forEach(b => b.addEventListener('click', () => goTo(+b.dataset.p)));
const panel = document.getElementById('panel'), fold = document.getElementById('fold');
fold.addEventListener('click', () => { panel.classList.toggle('folded'); fold.textContent = panel.classList.contains('folded') ? 'つまみを出す' : 'つまみを隠す'; });
const hint = document.getElementById('hint');
let hintOff = false;
function touched() { if (!hintOff) { hintOff = true; setTimeout(() => hint.style.opacity = 0, 2500); } }
// 確かめ用:コンソールから window.scaleKnobs({fog:1}) のように呼べる
window.scaleKnobs = (o) => { anim = null; Object.assign(k, o); syncInputs(); syncMaster(); return camera.position.toArray().map(Math.round); };

// URL の ?k=0,0,1,... (つまみの順に、0〜1。足りない分は初めの値。画角以外は0)で始めの状態を決められる
{
  const q = new URLSearchParams(location.search).get('k');
  if (q) { q.split(',').forEach((v, i) => { const x = parseFloat(v); if (KNOBS[i] && x >= 0 && x <= 1) k[KNOBS[i].id] = x; }); syncInputs(); syncMaster(); }
}

// ---------- 音(Web Audio) ----------
// 冷却塔の中を水が落ちる轟音と、ときどき鳴る金属の音。つまみ1本で次をまとめて動かす。
//   響き: 狭い部屋(0.3秒で消える)⇔ 広い空間(6秒尾を引く)。2つの響きを混ぜる割合を変える
//   こだま: 壁からの跳ね返りが戻るまでの時間 0.02秒 ⇔ 1.1秒(音は秒速約340m なので、約190m 先の壁)
//   音の高さ: 金属の音の基音 1800Hz ⇔ 55Hz(大きい物ほど低く鳴る)。消えるまでの時間も 0.15秒 ⇔ 3.5秒
//   高い音の減り方: 遠くの音ほど高い音が空気に吸われる。轟音の上の周波数 12kHz ⇔ 350Hz
let snd = null;
function makeSound() {
  const ctx = new AudioContext();
  const sr = ctx.sampleRate;
  const P = (a, v) => a.setTargetAtTime(v, ctx.currentTime, 0.15);
  // 雑音と響きの元
  const noiseBuf = ctx.createBuffer(2, sr * 4, sr);
  for (let c = 0; c < 2; c++) { const d = noiseBuf.getChannelData(c); let b = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; b = 0.97 * b + 0.03 * w; d[i] = w * 0.35 + b * 2.2; } }
  const ir = (sec) => { const n = Math.floor(sr * sec), buf = ctx.createBuffer(2, n, sr);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2) * Math.exp(-3 * i / n); }
    return buf; };
  const out = ctx.createDynamicsCompressor(); out.connect(ctx.destination);
  const master = ctx.createGain(); master.gain.value = 0; master.connect(out);
  const air = ctx.createBiquadFilter(); air.type = 'lowpass'; air.connect(master);   // 空気が高い音を吸う
  const dry = ctx.createGain(); dry.connect(air);
  const small = ctx.createConvolver(); small.buffer = ir(0.3);
  const big = ctx.createConvolver(); big.buffer = ir(6);
  const gS = ctx.createGain(), gB = ctx.createGain();
  small.connect(gS); big.connect(gB); gS.connect(air); gB.connect(air);
  const echo = ctx.createDelay(2), fb = ctx.createGain(), eLP = ctx.createBiquadFilter(), eOut = ctx.createGain();
  eLP.type = 'lowpass'; eLP.frequency.value = 1500;
  echo.connect(eLP); eLP.connect(fb); fb.connect(echo); eLP.connect(eOut); eOut.connect(air);
  const bus = ctx.createGain();   // ここに入れた音が、乾いた音・響き・こだまに分かれる
  bus.connect(dry); bus.connect(small); bus.connect(big); bus.connect(echo);
  // 水の轟音
  const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass';
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
  const roar = ctx.createGain();
  src.connect(hp); hp.connect(lp); lp.connect(roar); roar.connect(bus); src.start();
  let x = 0;
  // 金属の音(タンクや配管を叩いたような音)。部分音を重ね、高い部分音ほど早く消す
  function clank() {
    setTimeout(clank, 2500 + Math.random() * 4000);
    if (ctx.state !== 'running') return;   // 止めている間は鳴らさない(再開したときにまとめて鳴らないように)
    const t0 = ctx.currentTime + 0.05, f0 = lerpLog(1800, 55, x), dec = lerpLog(0.15, 3.5, x);
    const g = ctx.createGain(); g.gain.value = 0.5; g.connect(bus);
    [[1, 1], [2.32, .6], [4.25, .4], [6.63, .25]].forEach(([r, a], i) => {
      const o = ctx.createOscillator(), e = ctx.createGain();
      o.frequency.value = f0 * r * (1 + (Math.random() - .5) * .01);
      e.gain.setValueAtTime(0, t0); e.gain.linearRampToValueAtTime(a, t0 + 0.004 + 0.03 * x);
      e.gain.exponentialRampToValueAtTime(1e-4, t0 + dec / (1 + i * 0.7));
      o.connect(e); e.connect(g); o.start(t0); o.stop(t0 + dec + 0.1);
    });
  }
  setTimeout(clank, 600);
  return {
    ctx,
    analyser:(() => { const a = ctx.createAnalyser(); master.connect(a); return a; })(),
    update(v) {
      x = v;
      P(hp.frequency, lerpLog(1500, 25, v)); P(lp.frequency, lerpLog(12000, 350, v)); P(roar.gain, lerp(0.25, 0.9, v));
      P(dry.gain, lerp(1, 0.35, v)); P(gS.gain, (1 - v) * 0.5); P(gB.gain, v * 0.9);
      P(echo.delayTime, lerp(0.02, 1.1, v)); P(fb.gain, lerp(0.1, 0.45, v)); P(eOut.gain, lerp(0.05, 0.5, v));
      P(air.frequency, lerpLog(16000, 2500, v));
    },
    on(play) { P(master.gain, play ? 0.6 : 0); },
  };
}
{
  const b = document.getElementById('sound');
  let playing = false;
  b.addEventListener('click', async () => {
    if (!snd) { snd = makeSound(); snd.update(k.sound); window.scaleSound = snd; }   // 確かめ用
    playing = !playing;
    if (playing) await snd.ctx.resume();
    snd.on(playing);
    if (!playing) setTimeout(() => { if (!playing) snd.ctx.suspend(); }, 600);   // 音が消えてから、音の処理も止める
    b.classList.toggle('on', playing);
    b.textContent = playing ? '音を止める' : '音を出す(ヘッドホン推奨)';
  });
}

// ---------- ループ ----------
let simT = 0, last = performance.now();
let recording = false;
function frame(now) {
  if (recording) { requestAnimationFrame(frame); return; }   // 書き出し中は、コマを外から進める
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (anim) {
    let u = Math.min(1, (now - anim.t0) / anim.dur); const e = u * u * (3 - 2 * u);
    for (const o of KNOBS) k[o.id] = lerp(anim.from[o.id], anim.to[o.id], e);
    syncInputs(); syncMaster();
    if (u >= 1) anim = null;
  }
  simT += dt * lerpLog(14, 1, k.speed);
  draw((now * 0.001) % 100);
  requestAnimationFrame(frame);
}
function draw(time) {
  apply();
  placeCamera(simT);
  animate(simT);
  PU.uTime.value = time;
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  FXU.tDepth.value = rt.depthTexture; FXU.uNear.value = camera.near; FXU.uFar.value = camera.far;
  FXU.fogColor.value.copy(scene.fog.color); FXU.fogDensity.value = scene.fog.density;
  renderer.setRenderTarget(fxRT); renderer.setClearColor(0x000000, 0); renderer.clear(true, false, false);
  renderer.autoClear = false; renderer.render(fxScene, camera); renderer.autoClear = true;
  renderer.setClearColor(0x000000, 1);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
requestAnimationFrame(frame);

// 動画の書き出し用(output/ の書き出しスクリプトから使う)。
// begin() でつまみの欄と案内を隠して画面いっぱいにし、step(dt, つまみ) で1コマ進めて、その絵を JPEG で返す
window.scaleRecord = {
  begin() {
    recording = true; anim = null;
    document.getElementById('panel').style.display = 'none';
    document.getElementById('hint').style.display = 'none';
    resize(); simT = 0;
  },
  step(dt, knobs) {
    Object.assign(k, knobs);
    simT += dt * lerpLog(14, 1, k.speed);
    draw(simT % 100);
    return canvas.toDataURL('image/jpeg', 0.92);
  },
};
</script>
</body>
</html>
